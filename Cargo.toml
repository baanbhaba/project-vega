[package]
name = "vega"
version = "0.1.0"
edition = "2024"
authors = ["Vega Contributors"]
description = "A blazing-fast, GPU-accelerated file manager for Linux"
license = "MIT"

[[bin]]
name = "vega"
path = "src/main.rs"

[dependencies]
# ── UI ──────────────────────────────────────────────────────────────────────
slint = "1.9"

# ── Async / Threading ───────────────────────────────────────────────────────
tokio        = { version = "1", features = ["full"] }
rayon        = "1.10"
crossbeam    = "0.8"
flume        = "0.11"                   # lock-free MPMC channels

# ── Filesystem ──────────────────────────────────────────────────────────────
notify       = "8"                      # inotify/fanotify watcher
walkdir      = "2"
dunce        = "1"                      # canonicalize paths sanely
trash        = "5"                      # Freedesktop Trash integration
open         = "5"                      # xdg-open default app launcher

# ── Archive Support ──────────────────────────────────────────────────────────
zip          = "2"
tar          = "0.4"
flate2       = "1"
xz2          = "0.1"
zstd         = "0.13"

# ── Checksums ───────────────────────────────────────────────────────────────
blake3       = "1"
md-5         = "0.10"
sha2         = "0.10"
hex          = "0.4"

# ── Git Status ───────────────────────────────────────────────────────────────
git2         = { version = "0.20", default-features = false }

# ── MIME / File type detection ───────────────────────────────────────────────
infer        = "0.16"                   # magic-byte based MIME detection

# ── Fuzzy search ─────────────────────────────────────────────────────────────
nucleo-matcher = "0.3"                  # blazing-fast fuzzy matcher (helix editor's engine)
regex        = "1"                      # regex engine for bulk rename
dirs-next    = "2"                      # XDG home/desktop/downloads directories
bzip2        = "0.4"                    # bzip2 compression for tar.bz2 archives

# ── Serialization (settings / tags store) ────────────────────────────────────
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"

# ── Utilities ────────────────────────────────────────────────────────────────
libc         = "0.2"
once_cell    = "1"
parking_lot  = "0.12"
log          = "0.4"
env_logger   = "0.11"
anyhow       = "1"
humansize    = "2"                      # human-readable file sizes (1.2 MB etc.)
chrono       = { version = "0.4", features = ["serde"] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 1              # faster dev builds with basic optimization
